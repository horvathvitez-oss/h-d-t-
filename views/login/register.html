<!DOCTYPE html>
<html lang="hu">
<head>
  <title>HÓDÍTÓ / Regisztráció</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="views/login/images/icons/favicon.ico"/>
  <link rel="stylesheet" type="text/css" href="views/login/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="views/login/fonts/font-awesome-4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" type="text/css" href="views/login/fonts/Linearicons-Free-v1.0.0/icon-font.min.css">
  <link rel="stylesheet" type="text/css" href="views/login/vendor/animate/animate.css">
  <link rel="stylesheet" type="text/css" href="views/login/vendor/css-hamburgers/hamburgers.min.css">
  <link rel="stylesheet" type="text/css" href="views/login/vendor/animsition/css/animsition.min.css">
  <link rel="stylesheet" type="text/css" href="views/login/vendor/select2/select2.min.css">
  <link rel="stylesheet" type="text/css" href="views/login/vendor/daterangepicker/daterangepicker.css">
  <link rel="stylesheet" type="text/css" href="views/login/css/util.css">
  <link rel="stylesheet" type="text/css" href="views/login/css/main.css">
  <link rel="stylesheet" type="text/css" href="/views/css/custom.css">
</head>
<body class="parchment-screen auth-screen">
  <div class="parchment-overlay"></div>
  <div class="auth-page-shell">
    <div class="limiter">
      <div class="container-login100 auth-container">
        <div class="wrap-login100 p-t-50 p-b-30 parchment-auth-card">
          <form class="login100-form validate-form" action="/authenticate" method="post">
            <div class="auth-brand-block" align="center">
              <div class="auth-brand-title">HÓDÍTÓ</div>
              <div class="auth-brand-tagline">az érettségi-játék</div>
              <p class="auth-brand-copy">Készíts fiókot, és indulhat a hódítás.</p>
              <div id="registerError" class="auth-register-error" style="display:none;"></div>
            </div>

            <div class="wrap-input100 validate-input m-b-16" data-validate="Please enter your username!">
              <input class="input100" type="text" name="username" placeholder="Username">
              <span class="focus-input100"></span>
            </div>

            <div class="wrap-input100 validate-input m-b-16" data-validate="Please enter email: ex@abc.xyz">
              <input class="input100" type="text" name="email" placeholder="Email">
              <span class="focus-input100"></span>
            </div>

            <div class="wrap-input100 validate-input m-b-20" data-validate="Please enter password">
              <span class="btn-show-pass">
                <i class="fa fa fa-eye"></i>
              </span>
              <input class="input100" type="password" name="password" placeholder="Password">
              <span class="focus-input100"></span>
            </div>

            <div class="wrap-input100 validate-input m-b-20" data-validate="Please enter password">
              <span class="btn-show-pass">
                <i class="fa fa fa-eye"></i>
              </span>
              <input class="input100" type="password" name="passwordConf" placeholder="Confirm Password">
              <span class="focus-input100"></span>
            </div>

            <div class="container-login100-form-btn">
              <button class="login100-form-btn auth-primary-btn">
                Regisztráció
              </button>
            </div>

            <div class="auth-switch-row">
              <span class="txt2 p-b-10">Már van fiókod?</span>
              <a href="/login" class="txt3 bo1 hov1 auth-link-accent">Belépés</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="views/login/vendor/jquery/jquery-3.2.1.min.js"></script>
  <script src="views/login/vendor/animsition/js/animsition.min.js"></script>
  <script src="views/login/vendor/bootstrap/js/popper.js"></script>
  <script src="views/login/vendor/bootstrap/js/bootstrap.min.js"></script>
  <script src="views/login/vendor/select2/select2.min.js"></script>
  <script src="views/login/vendor/daterangepicker/moment.min.js"></script>
  <script src="views/login/vendor/daterangepicker/daterangepicker.js"></script>
  <script src="views/login/vendor/countdowntime/countdowntime.js"></script>
  <script src="views/login/js/main.js"></script>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('error');
      var box = document.getElementById('registerError');
      if (!box || !code) return;

      var messages = {
        username_taken: 'Ez a felhasználónév már foglalt.',
        email_taken: 'Ez az email cím már használatban van.',
        duplicate: 'Ez az email cím vagy felhasználónév már foglalt.',
        password_mismatch: 'A két jelszó nem egyezik.',
        missing_fields: 'Tölts ki minden mezőt.'
      };

      if (!messages[code]) return;
      box.textContent = messages[code];
      box.style.display = 'block';
    })();
  </script>
</body>
</html>
